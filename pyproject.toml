[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "quantpolars"
version = "0.5.0"
description = "A blazingly fast package for quantitative finance analysis using Polars"
authors = [{name = "Matthew G. Son"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["finance", "quantitative", "options", "polars", "data-analysis", "high-performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "maturin>=1.7", "scipy"]
styling = ["great-tables>=0.6.0"]

[tool.maturin]
python-source = "src"
module-name = "quantpolars._internal"
features = ["pyo3/extension-module"]